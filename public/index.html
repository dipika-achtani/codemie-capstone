<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Manager</h1>
      <p class="subtitle">Keep track of what needs to be done</p>
    </header>

    <section class="add-task">
      <form id="task-form">
        <div class="form-row">
          <input
            type="text"
            id="task-input"
            placeholder="What needs to be done?"
            autocomplete="off"
            maxlength="200"
          />
          <select id="task-priority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low'>Low</option>
          </select>
          <input type="date" id="task-due-date" />
          <button type="submit">Add Task</button>
        </div>
      </form>
    </section>

    <section class="task-list">
      <div class="filter-sort-bar">
        <div class="filter-controls">
          <button type="button" data-filter="all" class="active">All</button>
          <button type="button" data-filter="active">Active</button>
          <button type="button" data-filter="completed">Completed</button>
        </div>
        <select id="sort-control">
          <option value="default">Default Order</option>
          <option value="priority">Sort by Priority</option>
          <option value="due_date">Sort by Due Date</option>
        </select>
      </div>
      <div id="task-count" class="task-count"></div>
      <ul id="tasks"></ul>
      <p id="empty-msg" class="empty-msg hidden">No tasks yet. Add one above!</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
