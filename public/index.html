<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Task Manager</h1>
      <p class="subtitle">Keep track of what needs to be done</p>
    </header>

    <section class="add-task">
      <form id="task-form">
        <input
          type="text"
          id="task-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          maxlength="200"
        />
        <button type="submit">Add Task</button>
      </form>
    </section>

    <section class="task-list">
      <div id="task-count" class="task-count"></div>
      <ul id="tasks"></ul>
      <p id="empty-msg" class="empty-msg hidden">No tasks yet. Add one above!</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
